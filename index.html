<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Poker Hand Logger</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Log and track your poker hand results">
    <meta name="theme-color" content="#282828">
    
    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Poker Log">
    
    <!-- iOS icons -->
    <link rel="apple-touch-icon" href="icons/apple-icon-180x180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-icon-180x180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-icon-167x167.png">
    
    <!-- iOS splash screens -->
    <link rel="apple-touch-startup-image" href="icons/apple-splash-2048-2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/apple-splash-1668-2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/apple-splash-1536-2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/apple-splash-1125-2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/apple-splash-1242-2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/apple-splash-828-1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/apple-splash-1242-2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/apple-splash-750-1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="icons/apple-splash-640-1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    
    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="icons/favicon.ico">
    
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="poker-logger">
        <div class="display" id="hand-display">
            <div class="stats-display">
                <span class="stat-item fold-stat">
                    <span class="stat-label">FOLD</span>
                    <span class="stat-value" id="fold-percent">000%</span>
                </span>
                <span class="stat-item win-stat">
                    <span class="stat-label">WIN</span>
                    <span class="stat-value" id="win-percent">000%</span>
                </span>
                <span class="stat-item lose-stat">
                    <span class="stat-label">LOSE</span>
                    <span class="stat-value" id="lose-percent">000%</span>
                </span>
            </div>
            <span id="main-display-text"></span>
            <span id="hand-counter">0</span>
        </div>

        <div class="button-grid main-inputs">
            <button class="btn btn-card">K</button>
            <button class="btn btn-modifier">Suited</button>
            <button class="btn btn-modifier">Off</button>
            <button class="btn btn-action">Hide</button> 
            <button class="btn btn-card">T</button>
            <button class="btn btn-card">J</button>
            <button class="btn btn-card">Q</button>
            <button class="btn btn-action clear">Clear</button> 
            <button class="btn btn-card">7</button>
            <button class="btn btn-card">8</button>
            <button class="btn btn-card">9</button>
            <button class="btn btn-outcome lose">Lose</button>
            <button class="btn btn-card">4</button>
            <button class="btn btn-card">5</button>
            <button class="btn btn-card">6</button>
            <button class="btn btn-outcome win">Win</button>
            <button class="btn btn-card">A</button>
            <button class="btn btn-card">2</button>
            <button class="btn btn-card">3</button>
            <button class="btn btn-outcome fold">Fold</button>
        </div>
    </div>
    <div id="history-view" class="history-view">
        <div class="history-content">
            <button class="close-history-btn" id="close-history-view-btn">&times;</button>
            <h2>History &amp; Stats</h2>
            <button class="btn history-action-btn" id="copy-history-btn">Copy History to Clipboard</button>
            <button class="btn history-action-btn" id="export-history-btn">Export History as CSV</button>
            <button class="btn history-action-btn" id="reset-stats-btn">Reset Statistics</button>
            <button class="btn history-action-btn" id="reset-history-btn">Reset Hand History</button>
        </div>
    </div>
    
    <!-- Main script -->
    <script src="script.js" defer></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
