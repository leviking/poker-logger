<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Hand Logger</title>
    <link rel="stylesheet" href=style.css>
</head>
<body>

    <div class="poker-logger">
        <div class="display" id="hand-display">
            <span id="main-display-text"></span>  <span id="hand-counter">0</span>
        </div>

        <div class="button-grid main-inputs">
            <button class="btn btn-card">K</button>
            <button class="btn btn-modifier">Suited</button>
            <button class="btn btn-modifier">Off</button>
            <button class="btn btn-action">Hide</button> 
            <button class="btn btn-card">T</button>
            <button class="btn btn-card">J</button>
            <button class="btn btn-card">Q</button>
            <button class="btn btn-action">Clear</button> 
            <button class="btn btn-card">7</button>
            <button class="btn btn-card">8</button>
            <button class="btn btn-card">9</button>
            <button class="btn btn-outcome lose">Lose</button>
            <button class="btn btn-card">4</button>
            <button class="btn btn-card">5</button>
            <button class="btn btn-card">6</button>
            <button class="btn btn-outcome win">Win</button>
            <button class="btn btn-card">A</button>
            <button class="btn btn-card">2</button>
            <button class="btn btn-card">3</button>
            <button class="btn btn-outcome fold">Fold</button>
        </div>
    </div>
    <script src="script.js" defer></script>
    </body>
</html>
