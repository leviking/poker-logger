<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Hand Logger</title>
    <style>
        @font-face {
          font-family: 'DS14ML'; /* Name you'll use in CSS */
          src: url('DS14ML.woff2') format('woff2'), /* Path to your font file (modern) */
               url('DS14ML.woff') format('woff');  /* Path to your font file (older) */
          font-weight: normal;
          font-style: normal;
        }
        /* Basic Reset & Body Styling */
        :root {
            --bg-color: #EAEAEA;      /* Light grey background */
            --display-bg: #282828;   /* Darker display background */
            --button-bg: #C0C0C0;    /* Lighter STANDARD button grey (like KO II light buttons) */
            --button-text: #202020; /* Darker text for standard buttons */
            --button-card-bg: #1A1A1A; /* NEAR BLACK for card buttons */
            --button-card-text: #E0E0E0; /* Light text for card buttons */
            --accent-color: #FF6F00; /* Orange accent */
            --accent-text: #111111;  /* Dark text for accent buttons */
            --text-color: #1a1a1a;   /* Main text color (unused here yet) */
            --display-text: #F5F5F5; /* Text color for the display */
            --border-radius: 4px;    /* Subtle rounding */
            --gap: 8px;              /* Gap between grid items */
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            height: 100%;
            font-family: monospace, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* Clean sans-serif */
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }
        
        /* Main Container */
        .poker-logger {
            max-width: 400px; /* Max width for larger screens */
            min-height: 100vh; /* Ensure it takes at least full viewport height */
            margin: 0 auto;   /* Center horizontally */
            padding: 15px;
            background-color: #D8D8D8; /* Slightly different grey for the main panel */
            display: flex;
            justify-content: flex-end;
            flex-direction: column;
            gap: 15px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        /* Display Area */
        .display {
            background-color: var(--display-bg);
            color: var(--display-text);
            padding: 15px 20px;
            border-radius: var(--border-radius);
            font-family: 'DS14ML', monospace; /* Use DS14ML first */
            font-size: 1.8em;
            font-weight: bold;
            min-height: 96px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            letter-spacing: 2px;
            border: 1px solid #555;
        }
        
        /* Grid Container for Buttons */
        .button-grid {
            display: grid;
            gap: var(--gap);
        }
        
        /* Specific Grid Layouts */
        .main-inputs {
            grid-template-columns: repeat(4, 1fr); /* 4 columns for the main 4x4 grid */
        }
        
        /* General Button Styling */
        .btn {
            border: none;
            background-color: var(--button-bg); /* Default to LIGHTER gray now */
            color: var(--button-text); /* Default to DARKER text */
            padding: 10px; /* Base padding */
            border-radius: var(--border-radius);
            font-size: 1.1em;
            /*font-weight: 600; */
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: flex; /* Keep flex for alignment */
            justify-content: center; /* Default center */
            align-items: center;   /* Default center */
            text-align: center;
            min-height: 50px; /* Minimum height */
            user-select: none; /* Prevent text selection on click/drag */
            border: 1px solid #888; /* Adjust border for lighter buttons */
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
            position: relative; /* Needed for potential future pseudo-elements if desired */
        }
        
        /* Style ALL buttons within the main 4x4 grid to be squarish */
        .main-inputs .btn {
           aspect-ratio: 1 / 1; /* Attempt to keep them square */
           padding: 5px; /* Reset padding for square buttons */
           /* font-size: 1.3em;  */
        }
        
        /* === NEW/MODIFIED STYLES START HERE === */
        
        /* Style for CARD RANK buttons (A-2) */
        .btn-card {
            background-color: var(--button-card-bg); /* Dark background */
            color: var(--button-card-text);      /* Light text color */
            border-color: #444;                  /* Darker border */
            justify-content: flex-start;         /* Align text horizontal start (left) */
            align-items: flex-start;             /* Align text vertical start (top) */
            padding: 0.3em 0.4em;                /* Fine-tune padding for top-left */
            font-size: 1.1em;                    /* Adjust font size if needed */
            font-weight: bold;                   /* Make rank stand out */
        }
        
        /* === NEW/MODIFIED STYLES END HERE === */
        
        /* Style for Modifier buttons (S, O) - using default light button style now */
        .btn-modifier {
            color: var(--button-card-text);
            background-color: #505050;
            font-size: .75em;
            justify-content: flex-start;         /* Align text horizontal start (left) */
            align-items: flex-start;             /* Align text vertical start (top) */
        }
        
        /* Style for Action buttons (Hide, Clr) */
        .btn-action {
            font-size: .75em;
            justify-content: flex-start;         /* Align text horizontal start (left) */
            align-items: flex-start;             /* Align text vertical start (top) */
           /* Add specific styles if needed, e.g., Clr might be accent */
        }
        .btn-action.clear { /* Example: making Clr button use accent color */
             background-color: var(--accent-color);
             color: var(--accent-text);
             border-color: #cc5800;
        }
        
        
        /* Specific Outcome Styling (Win/Lose/Fold) */
        .btn-outcome.win {
            background-color: rgb(116, 177, 217); 
            color: #222222;
            border-color: #222;
            justify-content: center; /* Override card style if needed */
            align-items: center;   /* Override card style if needed */
        }
         .btn-outcome.lose {
            background-color: rgb(235, 89, 60); 
            color: #222222;
            border-color: #222;
            justify-content: center; /* Override card style if needed */
            align-items: center;   /* Override card style if needed */
        }
        .btn-outcome.fold { /* Fold is now ACCENT as per user HTML example */
            background-color: rgb(221, 66, 105);
            color: #222222;
            border-color: #222;
            justify-content: center; /* Override card style if needed */
            align-items: center;   /* Override card style if needed */
        }
        
        
        /* Interaction States */
        .btn:hover {
            filter: brightness(1.1); /* Adjusted brightness for lighter/darker buttons */
        }
        .btn-card:hover {
            filter: brightness(1.3); /* Make dark buttons brighten more */
        }
        
        .btn:active {
            transform: scale(0.96);
            filter: brightness(0.9);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="poker-logger">
        <div class="display" id="hand-display">--</div>

        <div class="button-grid main-inputs">
            <button class="btn btn-card">K</button>
            <button class="btn btn-modifier">Suited</button>
            <button class="btn btn-modifier">Off</button>
            <button class="btn btn-action">Hide</button> 
            <button class="btn btn-card">T</button>
            <button class="btn btn-card">J</button>
            <button class="btn btn-card">Q</button>
            <button class="btn btn-action">Clear</button> 
            <button class="btn btn-card">7</button>
            <button class="btn btn-card">8</button>
            <button class="btn btn-card">9</button>
            <button class="btn btn-outcome lose">Lose</button>
            <button class="btn btn-card">4</button>
            <button class="btn btn-card">5</button>
            <button class="btn btn-card">6</button>
            <button class="btn btn-outcome win">Win</button>
            <button class="btn btn-card">A</button>
            <button class="btn btn-card">2</button>
            <button class="btn btn-card">3</button>
            <button class="btn btn-outcome fold">Fold</button>
        </div>
    </div>
    <script>
        // --- State Variables ---
        let card1 = null;
        let card2 = null;
        let suitModifier = null; // 's', 'o', or null
        let outcome = null; // 'Win', 'Lose', 'Fold', or null

        // --- DOM Elements ---
        const displayElement = document.getElementById('hand-display');
        const cardButtons = document.querySelectorAll('.btn-card');
        const modifierButtons = document.querySelectorAll('.btn-modifier');
        const outcomeButtons = document.querySelectorAll('.btn-outcome');
        // Target action buttons individually or add specific classes/ids if needed
        const clearButton = document.querySelector('.btn-action.clear');
        const hideButton = document.querySelector('.btn-action:not(.clear)'); // Simple way to get hide button

        // --- Card Rank Order (High to Low for sorting) ---
        const rankOrder = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];

        // --- Update Display Function ---
        function updateDisplay() {
            let handString = '';
            let displayString = '';

            // Build hand string (Sort cards, handle pairs, add modifier)
            if (card1 && card2) {
                const rank1Index = rankOrder.indexOf(card1);
                const rank2Index = rankOrder.indexOf(card2);

                // Determine higher and lower rank card based on index (lower index is higher rank)
                const sortedCard1 = rank1Index < rank2Index ? card1 : card2;
                const sortedCard2 = rank1Index < rank2Index ? card2 : card1;

                // If it's a pair, just show the pair (no suit modifier)
                if (sortedCard1 === sortedCard2) {
                    handString = sortedCard1 + sortedCard2;
                } else {
                    // Otherwise, show sorted cards + suit modifier if it exists
                    handString = sortedCard1 + sortedCard2 + (suitModifier || ''); // Append 's' or 'o'
                }
            } else if (card1) {
                // Only one card selected
                handString = card1;
            } else {
                // No cards selected
                handString = '--';
            }

            // Combine hand and outcome for final display
            if (handString !== '--' && outcome) {
                displayString = `${handString} : ${outcome}`;
            } else if (handString !== '--') {
                displayString = handString;
            } else if (outcome) {
                 // Only show outcome if no hand is selected yet
                displayString = outcome;
            }
            else {
                displayString = '--'; // Default placeholder
            }

            displayElement.textContent = displayString;
        }

        // --- Event Listeners ---

        // Card Buttons (A-2)
        cardButtons.forEach(button => {
            button.addEventListener('click', () => {
                const rank = button.textContent;

                if (!card1) { // Selecting first card
                    card1 = rank;
                    suitModifier = null; // Reset modifier when first card is picked
                    outcome = null; // Also reset outcome
                } else if (!card2) { // Selecting second card
                    // Prevent selecting the exact same button twice unless forming a pair
                    if (rank !== card1) {
                         card2 = rank;
                    } else { // Allow selecting same rank for a pair
                        card2 = rank;
                        suitModifier = null; // Pairs can't be suited/offsuit
                    }
                } else { // Both cards already selected, start new hand
                    card1 = rank;
                    card2 = null;
                    suitModifier = null;
                     outcome = null; // Reset outcome too
                }

                // Automatically clear suit modifier if a pair is formed
                if (card1 && card2 && card1 === card2) {
                    suitModifier = null;
                }

                updateDisplay();
            });
        });

        // Modifier Buttons (Suited, Off)
        modifierButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Only allow setting modifier if two DIFFERENT cards are selected
                if (card1 && card2 && card1 !== card2) {
                    if (button.textContent === 'Suited') {
                        suitModifier = 's';
                    } else if (button.textContent === 'Off') {
                        suitModifier = 'o';
                    }
                    updateDisplay();
                } else if (card1 && card2 && card1 === card2) {
                    console.warn("Cannot set suited/off-suit for pairs."); // User feedback
                } else {
                    console.warn("Select two different cards before setting suited/off-suit."); // User feedback
                }
            });
        });

        // Outcome Buttons (Win, Lose, Fold)
        outcomeButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Only set outcome if at least a hand is started (card1 exists)
                if (card1) {
                     outcome = button.textContent;
                     updateDisplay();
                     // Optional: Log the final hand and outcome here
                     // console.log(`Logged: ${displayElement.textContent}`);
                } else {
                    console.warn("Select cards for the hand first.");
                }

            });
        });

        // Clear Button
        if (clearButton) {
            clearButton.addEventListener('click', () => {
                card1 = null;
                card2 = null;
                suitModifier = null;
                outcome = null;
                updateDisplay();
            });
        }

        // Hide Button (Placeholder)
        if (hideButton) {
            hideButton.addEventListener('click', () => {
                // Functionality TBD - Example: toggle display visibility
                if (displayElement.style.visibility === 'hidden') {
                     displayElement.style.visibility = 'visible';
                     hideButton.textContent = 'Hide'; // Change back button text
                } else {
                    displayElement.style.visibility = 'hidden';
                    hideButton.textContent = 'Show'; // Change button text
                }
                console.log('Hide button clicked - Toggling display visibility.');
            });
        }

        // --- Initial Display Update On Load ---
        updateDisplay();

    </script>

    </body>
</html>
